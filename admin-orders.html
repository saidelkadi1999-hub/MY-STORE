<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CÂLINE · Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="caline-config.js"></script>
<style>
:root{
  --cream:#fbf8f2;--beige:#f2eae0;--paper:#fffdf9;--ink:#3c342a;--taupe:#8b7f6d;
  --gold:#c2a35e;--gold-deep:#a8863f;--gold-soft:#dcc9a0;--line:#e7dcc9;--green:#2c7a4d;--red:#b0573f;
  --serif:'Cormorant Garamond',serif;--sans:'Jost',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-weight:300;-webkit-font-smoothing:antialiased}
.serif{font-family:var(--serif)} .hidden{display:none!important}
input,select,textarea,button{font-family:var(--sans)}

/* login */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 80% at 50% 0%,#f6efe3,#efe5d4)}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:40px;width:100%;max-width:390px;box-shadow:0 30px 70px rgba(60,52,42,.10);text-align:center}
.brand{font-family:var(--serif);font-size:32px;letter-spacing:.14em;color:var(--gold-deep)}
.login-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--taupe);margin:4px 0 28px}
.field{text-align:left;margin-bottom:15px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--cream);font-size:15px;color:var(--ink);transition:.2s}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);background:#fff}
.btn-gold{padding:13px 18px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:.3s}
.btn-gold:hover{filter:brightness(1.05);box-shadow:0 10px 26px rgba(168,134,63,.26)}
.btn-gold:disabled{opacity:.6}
.msg{font-size:13px;margin-top:14px;min-height:18px}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,40px);background:rgba(251,248,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .brand{font-size:23px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav a,.nav button{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);background:none;border:none;cursor:pointer;text-decoration:none;padding:8px 12px;border-radius:8px;transition:.2s}
.nav a.active,.nav a:hover{color:var(--gold-deep);background:var(--beige)}
.nav .logout{color:var(--gold-deep);border:1px solid var(--gold-soft)}
.nav .logout:hover{background:var(--gold-deep);color:#fff}

.shell{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,32px) clamp(14px,4vw,40px) 80px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-deep)}
.h-title{font-family:var(--serif);font-size:clamp(25px,4vw,33px);font-weight:600;margin-bottom:20px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;letter-spacing:.06em;padding:8px 14px;border:1px solid var(--line);background:var(--paper);border-radius:30px;cursor:pointer;color:var(--taupe);transition:.2s}
.chip.active{background:var(--gold-deep);color:#fff;border-color:var(--gold-deep)}
.search{margin-bottom:16px}
.search input{width:100%;max-width:340px;padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:14px}

/* table */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);padding:14px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.15s}
tbody tr:hover{background:var(--cream)}
.onum{font-family:var(--serif);font-size:15px;color:var(--ink)}
.muted{color:var(--taupe);font-size:12.5px}
.price{font-family:var(--serif);font-size:16px}
.badge{display:inline-block;padding:5px 11px;border-radius:20px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
.b-pending{background:#f3ead4;color:#9a7b2e}
.b-paid,.b-processing{background:#e3f0e6;color:#2c7a4d}
.b-shipped,.b-delivered{background:#e2ecf4;color:#3667a0}
.b-cancelled,.b-refunded{background:#f4e3de;color:#b0573f}
.empty{text-align:center;color:var(--taupe);padding:46px 16px}
.empty .serif{display:block;font-size:22px;color:var(--ink);margin-bottom:6px}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(60,52,42,.42);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--cream);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(30px);opacity:.6}to{transform:translateX(0);opacity:1}}
.drawer-head{position:sticky;top:0;background:var(--cream);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.drawer-head h2{font-family:var(--serif);font-size:22px;font-weight:600}
.drawer-head .sub{font-size:12px;color:var(--taupe);margin-top:2px}
.x{background:none;border:none;font-size:24px;color:var(--taupe);cursor:pointer;line-height:1}
.drawer-body{padding:22px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px}
.kv .k{color:var(--taupe)} .kv .v{text-align:right;color:var(--ink)}
.addr{font-size:14px;line-height:1.6;color:var(--ink)}
.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{font-size:14px;color:var(--ink)}
.item .meta{font-size:12px;color:var(--taupe);margin-top:2px}
.item .lt{font-family:var(--serif);font-size:15px;white-space:nowrap}
.totals{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:6px}
.totals .kv{padding:4px 0}
.totals .grand{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-family:var(--serif);font-size:19px}
.status-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status-row select{flex:1;min-width:160px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-size:13.5px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:680px){.hide-sm{display:none}}

/* Orders Pro v1.2 */
.ostats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.ostat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ostat .os-lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-bottom:8px}
.ostat .os-val{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);line-height:1}
.otoolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.otoolbar .search{flex:1;min-width:200px;margin:0}
.osel{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.obtn{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#c8a45a,#a67c2e);border:none;border-radius:10px;padding:10px 18px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.obtn:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(166,124,46,.6)}
.opager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.opager button{min-width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;cursor:pointer;transition:all .2s}
.opager button.active,.opager button:hover:not(:disabled){background:linear-gradient(135deg,#c8a45a,#a67c2e);color:#fff;border-color:transparent}
.opager button:disabled{opacity:.4;cursor:default}
.opager .opinfo{font-size:12px;color:var(--taupe);margin:0 6px}
@media(max-width:900px){.ostats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">CÂLINE</div>
    <div class="login-sub">Espace administration</div>
    <div class="field"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn-gold" style="width:100%">Se connecter</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand serif">CÂLINE</div>
    <div class="nav">
      <a href="admin.html">Tableau de bord</a>
      <a href="admin-products.html">Produits</a>
      <a href="admin-orders.html" class="active">Commandes</a>
      <a href="admin-analytics.html">Analytics</a>
      <a href="admin-customers.html">Clients</a>
      <button class="logout" id="logout">Déconnexion</button>
    </div>
  </div>

  <div class="shell">
    <div class="eyebrow">Boutique</div>
    <h1 class="h-title">Commandes</h1>

    <div class="ostats" id="ostats"></div>

    <div class="filters" id="filters"></div>

    <div class="otoolbar">
      <div class="search"><input id="search" placeholder="Rechercher : n°, e-mail, client, pays…"></div>
      <select id="fPeriod" class="osel"><option value="all">Toute période</option><option value="today">Aujourd’hui</option><option value="7">7 jours</option><option value="30">30 jours</option></select>
      <select id="fCountry" class="osel"><option value="all">Tous les pays</option></select>
      <select id="fPay" class="osel"><option value="all">Tout paiement</option><option value="stripe">Carte (Stripe)</option><option value="other">Autre</option></select>
      <select id="fSort" class="osel"><option value="date_desc">Plus récentes</option><option value="date_asc">Plus anciennes</option><option value="total_desc">Montant ↓</option><option value="total_asc">Montant ↑</option></select>
      <button id="exportCsv" class="obtn">Exporter CSV</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>N°</th><th>Client</th><th class="hide-sm">E-mail</th><th class="hide-sm">Pays</th><th>Statut</th><th>Total</th><th class="hide-sm">Date</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="opager" id="opager"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var cfg=window.CALINE_SUPABASE||{};
var sb=(cfg.url&&cfg.anonKey&&window.supabase)?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var $=function(id){return document.getElementById(id);};
var ORDERS=[],curFilter='all',current=null;
var curPeriod='all',curCountry='all',curPay='all',curSort='date_desc',curPage=1,O_PER=20;
var STATUSES=['pending','paid','processing','shipped','delivered','cancelled'];
var eur=function(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2200);}
function setMsg(t,c){var m=$('loginMsg');m.textContent=t||'';m.className='msg '+(c||'');}
function statusFr(s){return {pending:'En attente',paid:'Payée',processing:'En cours',shipped:'Expédiée',delivered:'Livrée',cancelled:'Annulée',refunded:'Remboursée'}[s]||s;}
function payFr(o){ if(o.payment_method){return {card:'Carte bancaire',cod:'Paiement à la livraison',transfer:'Virement',stripe:'Carte (Stripe)'}[o.payment_method]||o.payment_method;}
  return o.stripe_payment_intent?'Carte (Stripe)':'—'; }

/* ---------- AUTH ---------- */
async function doLogin(){
  if(!sb){setMsg('Configuration Supabase manquante.','err');return;}
  var e=$('email').value.trim(),p=$('password').value;
  if(!e||!p){setMsg('Renseignez vos identifiants.','err');return;}
  $('loginBtn').disabled=true;setMsg('Connexion…','');
  var r=await sb.auth.signInWithPassword({email:e,password:p});
  $('loginBtn').disabled=false;
  if(r.error){setMsg('Identifiants incorrects.','err');return;}
  enter();
}
async function enter(){
  var chk=await sb.rpc('admin_overview');
  if(chk.error){setMsg('Accès non autorisé.','err');await sb.auth.signOut();return;}
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  renderFilters(); loadOrders();
}
$('loginBtn').addEventListener('click',doLogin);
$('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('logout').addEventListener('click',async function(){if(sb)await sb.auth.signOut();location.reload();});

/* ---------- LOAD ---------- */
async function loadOrders(){
  try{
    // 1) Charger les commandes SANS jointure imbriquee (une jointure cassee faisait echouer toute la requete)
    var ro=await sb.from('orders').select('*').order('created_at',{ascending:false});
    if(ro.error){ console.error('[orders] erreur:', ro.error); toast('Erreur de chargement: '+(ro.error.message||'')); return; }
    var orders=ro.data||[];
    // 2) Charger les lignes de commande separement (best-effort)
    var ids=orders.map(function(o){return o.id;}).filter(function(x){return x!=null;});
    var itemsBy={};
    if(ids.length){
      try{
        var ri=await sb.from('order_items').select('order_id,name,unit_price,quantity,color,size,line_total').in('order_id',ids);
        if(!ri.error && ri.data){ ri.data.forEach(function(it){ (itemsBy[it.order_id]=itemsBy[it.order_id]||[]).push(it); }); }
        else if(ri.error){ console.warn('[order_items]', ri.error); }
      }catch(e){ console.warn('[order_items] ignore', e); }
    }
    // 3) Charger les clients lies separement (best-effort)
    var custIds=orders.map(function(o){return o.customer_id;}).filter(function(x){return x!=null;});
    var custBy={};
    if(custIds.length){
      try{
        var rc=await sb.from('customers').select('id,full_name,email,phone,address_line,city,postal_code,country').in('id',custIds);
        if(!rc.error && rc.data){ rc.data.forEach(function(c){ custBy[c.id]=c; }); }
        else if(rc.error){ console.warn('[customers]', rc.error); }
      }catch(e){ console.warn('[customers] ignore', e); }
    }
    // 4) Fusionner (meme forme que la jointure : o.order_items = tableau, o.customers = objet)
    orders.forEach(function(o){
      o.order_items = itemsBy[o.id] || [];
      o.customers = (o.customer_id!=null ? custBy[o.customer_id] : null) || null;
    });
    ORDERS=orders; renderStats(); populateCountries(); renderRows();
  }catch(err){
    console.error('[orders] erreur fatale', err); toast('Erreur de chargement des commandes');
  }
}

function renderFilters(){
  var labels={all:'Toutes',pending:'En attente',paid:'Payées',processing:'En cours',shipped:'Expédiées',delivered:'Livrées',cancelled:'Annulées'};
  var keys=['all'].concat(STATUSES);
  $('filters').innerHTML=keys.map(function(k){
    return '<div class="chip'+(k===curFilter?' active':'')+'" onclick="setFilter(\''+k+'\')">'+labels[k]+'</div>';
  }).join('');
}
function setFilter(k){curFilter=k;curPage=1;renderFilters();renderRows();}

function custName(o){return o.shipping_name||(o.customers&&o.customers.full_name)||'—';}

function payMethod(o){ return (o.stripe_payment_intent||o.stripe_session_id)?'stripe':'other'; }
function payLabel(o){ return (o.stripe_payment_intent||o.stripe_session_id)?'Carte (Stripe)':'\u2014'; }
function oCountry(o){ return ((o.shipping_country||'')+'').trim()||'\u2014'; }
function isPaidLike(st){ return st==='paid'||st==='processing'||st==='shipped'||st==='delivered'; }

function filteredOrders(){
  var q=($('search').value||'').toLowerCase();
  var now=new Date(); var today=now.toDateString();
  return ORDERS.filter(function(o){
    if(curFilter!=='all'&&o.status!==curFilter)return false;
    if(curPeriod!=='all'){
      var d=new Date(o.created_at);
      if(curPeriod==='today'){ if(d.toDateString()!==today)return false; }
      else { var days=curPeriod==='7'?7:30; if((now.getTime()-d.getTime())>days*86400000)return false; }
    }
    if(curCountry!=='all'&&oCountry(o)!==curCountry)return false;
    if(curPay!=='all'&&payMethod(o)!==curPay)return false;
    if(q){ var hit=(o.order_number||'').toLowerCase().indexOf(q)>=0
        ||(o.email||'').toLowerCase().indexOf(q)>=0
        ||custName(o).toLowerCase().indexOf(q)>=0
        ||oCountry(o).toLowerCase().indexOf(q)>=0;
      if(!hit)return false; }
    return true;
  }).sort(function(a,b){
    if(curSort==='date_asc')return new Date(a.created_at)-new Date(b.created_at);
    if(curSort==='total_desc')return (Number(b.total)||0)-(Number(a.total)||0);
    if(curSort==='total_asc')return (Number(a.total)||0)-(Number(b.total)||0);
    return new Date(b.created_at)-new Date(a.created_at);
  });
}

function renderStats(){
  var el=document.getElementById('ostats'); if(!el)return;
  var cnt={pending:0,paid:0,processing:0,shipped:0,delivered:0,cancelled:0,refunded:0}, rev=0;
  ORDERS.forEach(function(o){ if(cnt[o.status]!==undefined)cnt[o.status]++; if(isPaidLike(o.status))rev+=Number(o.total)||0; });
  var cards=[
    {l:'Nouvelles',v:cnt.pending+cnt.paid},
    {l:'En cours',v:cnt.processing},
    {l:'Exp\u00e9di\u00e9es',v:cnt.shipped+cnt.delivered},
    {l:'Annul\u00e9es',v:cnt.cancelled+cnt.refunded},
    {l:'Revenu total',v:eur(rev)}
  ];
  el.innerHTML=cards.map(function(x){return '<div class="ostat"><div class="os-lab">'+x.l+'</div><div class="os-val">'+x.v+'</div></div>';}).join('');
}

function populateCountries(){
  var sel=document.getElementById('fCountry'); if(!sel)return;
  var set={}; ORDERS.forEach(function(o){ var cc=oCountry(o); if(cc&&cc!=='\u2014')set[cc]=1; });
  var cur=sel.value;
  sel.innerHTML='<option value="all">Tous les pays</option>'+Object.keys(set).sort().map(function(cc){return '<option value="'+esc(cc)+'">'+esc(cc)+'</option>';}).join('');
  if(cur)sel.value=cur;
}

function renderRows(){
  var list=filteredOrders();
  var tb=$('rows');
  if(!list.length){
    tb.innerHTML='<tr><td colspan="7"><div class="empty"><span class="serif">Aucune commande</span>'+
      (ORDERS.length?'Aucune commande pour ces filtres.':'Les commandes appara\u00eetront ici d\u00e8s le premier paiement.')+'</div></td></tr>';
    document.getElementById('opager').innerHTML=''; return;
  }
  var pages=Math.ceil(list.length/O_PER);
  if(curPage>pages)curPage=pages; if(curPage<1)curPage=1;
  var page=list.slice((curPage-1)*O_PER, curPage*O_PER);
  tb.innerHTML=page.map(function(o){
    var dt=new Date(o.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    return '<tr onclick="openOrder('+o.id+')">'+
      '<td><span class="onum">'+esc(o.order_number||('#'+o.id))+'</span></td>'+
      '<td>'+esc(custName(o))+'</td>'+
      '<td class="hide-sm muted">'+esc(o.email||'\u2014')+'</td>'+
      '<td class="hide-sm muted">'+esc(oCountry(o))+'</td>'+
      '<td><span class="badge b-'+o.status+'">'+statusFr(o.status)+'</span></td>'+
      '<td class="price">'+eur(o.total)+'</td>'+
      '<td class="hide-sm muted">'+dt+'</td>'+
    '</tr>';
  }).join('');
  renderPager(list.length, pages);
}

function renderPager(total, pages){
  var el=document.getElementById('opager'); if(!el)return;
  if(pages<=1){ el.innerHTML='<span class="opinfo">'+total+' commande'+(total>1?'s':'')+'</span>'; return; }
  var h='<button '+(curPage<=1?'disabled':'')+' onclick="gotoPage('+(curPage-1)+')">\u2039</button>';
  var start=Math.max(1,curPage-2), end=Math.min(pages,start+4); start=Math.max(1,end-4);
  for(var p=start;p<=end;p++){ h+='<button class="'+(p===curPage?'active':'')+'" onclick="gotoPage('+p+')">'+p+'</button>'; }
  h+='<button '+(curPage>=pages?'disabled':'')+' onclick="gotoPage('+(curPage+1)+')">\u203a</button>';
  h+='<span class="opinfo">'+total+' commande'+(total>1?'s':'')+'</span>';
  el.innerHTML=h;
}
function gotoPage(p){ curPage=p; renderRows(); var w=document.querySelector('.table-wrap'); if(w)w.scrollTop=0; }

function exportCsv(){
  var list=filteredOrders();
  var head=['N\u00b0','Date','Client','E-mail','Pays','Statut','Paiement','Total'];
  var rows=list.map(function(o){
    var dt=new Date(o.created_at).toLocaleDateString('fr-FR');
    return [o.order_number||('#'+o.id), dt, custName(o), o.email||'', oCountry(o), statusFr(o.status), payLabel(o), (Number(o.total)||0).toFixed(2)];
  });
  var csv=[head].concat(rows).map(function(r){return r.map(function(c){var v=(''+c).replace(/"/g,'""'); return '"'+v+'"';}).join(',');}).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob); var a=document.createElement('a');
  a.href=url; a.download='commandes-caline-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function orefilter(){ curPage=1; renderRows(); }
$('search').addEventListener('input',renderRows);$('search').addEventListener('input',orefilter);
['fPeriod','fCountry','fPay','fSort'].forEach(function(id){var e=document.getElementById(id);if(e)e.addEventListener('change',function(){
  curPeriod=document.getElementById('fPeriod').value; curCountry=document.getElementById('fCountry').value;
  curPay=document.getElementById('fPay').value; curSort=document.getElementById('fSort').value; orefilter();
});});
(function(){var b=document.getElementById('exportCsv');if(b)b.addEventListener('click',exportCsv);})();

/* ---------- ORDER DETAIL DRAWER ---------- */
function openOrder(id){
  var o=ORDERS.find(function(x){return x.id===id;});if(!o)return;current=o;
  var c=o.customers||{};
  var name=custName(o);
  var phone=o.phone||c.phone||'—';
  var email=o.email||c.email||'—';
  var addrParts=[o.shipping_address||c.address_line, [(o.shipping_postal||c.postal_code||''),(o.shipping_city||c.city||'')].filter(Boolean).join(' '), o.shipping_country||c.country].filter(Boolean);
  var addr=addrParts.length?addrParts.map(esc).join('<br>'):'—';
  var items=o.order_items||[];
  var dt=new Date(o.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});

  var itemsHtml=items.length?items.map(function(it){
    var meta=[it.color,it.size].filter(Boolean).join(' · ');
    return '<div class="item"><div><div class="nm">'+esc(it.name)+'</div><div class="meta">'+
      (meta?esc(meta)+' · ':'')+'Qté '+it.quantity+' × '+eur(it.unit_price)+'</div></div>'+
      '<div class="lt">'+eur(it.line_total)+'</div></div>';
  }).join(''):'<div class="muted">Aucun article enregistré.</div>';

  var d=document.createElement('div');d.className='overlay';d.id='drawer';
  d.innerHTML='<div class="drawer">'+
    '<div class="drawer-head"><div><h2>'+esc(o.order_number||('#'+o.id))+'</h2><div class="sub">'+dt+'</div></div>'+
      '<button class="x" onclick="closeDrawer()">×</button></div>'+
    '<div class="drawer-body">'+

      '<div class="sec"><h3>Statut</h3><div class="status-row">'+
        '<select id="statSel">'+STATUSES.map(function(s){return '<option value="'+s+'"'+(s===o.status?' selected':'')+'>'+statusFr(s)+'</option>';}).join('')+'</select>'+
        '<button class="btn-gold" id="statSave">Enregistrer</button>'+
      '</div></div>'+

      '<div class="sec"><h3>Client</h3>'+
        '<div class="kv"><span class="k">Nom</span><span class="v">'+esc(name)+'</span></div>'+
        '<div class="kv"><span class="k">E-mail</span><span class="v">'+esc(email)+'</span></div>'+
        '<div class="kv"><span class="k">Téléphone</span><span class="v">'+esc(phone)+'</span></div>'+
      '</div>'+

      '<div class="sec"><h3>Adresse de livraison</h3><div class="addr">'+addr+'</div></div>'+

      ((o.notes&&(''+o.notes).trim())?'<div class="sec"><h3>Note du client</h3><div class="addr">'+esc(o.notes)+'</div></div>':'')+
      '<div class="sec"><h3>Produits commandés</h3>'+itemsHtml+'</div>'+

      '<div class="sec"><h3>Paiement</h3>'+
        '<div class="kv"><span class="k">Méthode</span><span class="v">'+esc(payFr(o))+'</span></div>'+
        (o.coupon_code?'<div class="kv"><span class="k">Coupon</span><span class="v">'+esc(o.coupon_code)+'</span></div>':'')+
        '<div class="totals">'+
          '<div class="kv"><span class="k">Sous-total</span><span class="v">'+eur(o.subtotal)+'</span></div>'+
          '<div class="kv"><span class="k">Livraison</span><span class="v">'+(Number(o.shipping_total)?eur(o.shipping_total):'Offerte')+'</span></div>'+
          (Number(o.discount_total)?'<div class="kv"><span class="k">Remise</span><span class="v">− '+eur(o.discount_total)+'</span></div>':'')+
          '<div class="kv grand"><span class="k">Total</span><span class="v">'+eur(o.total)+'</span></div>'+
        '</div>'+
      '</div>'+

    '</div></div>';
  document.body.appendChild(d);
  d.addEventListener('click',function(e){if(e.target===d)closeDrawer();});
  $('statSave').addEventListener('click',saveStatus);
}
function closeDrawer(){var d=$('drawer');if(d)d.remove();current=null;}

async function saveStatus(){
  if(!current)return;
  var ns=$('statSel').value;
  if(ns===current.status){toast('Aucun changement');return;}
  var btn=$('statSave');btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  var r=await sb.from('orders').update({status:ns}).eq('id',current.id);
  btn.disabled=false;btn.textContent='Enregistrer';
  if(r.error){toast('Erreur : '+r.error.message);return;}
  current.status=ns;
  var row=ORDERS.find(function(x){return x.id===current.id;});if(row)row.status=ns;
  toast('Statut mis à jour : '+statusFr(ns));
  renderRows();
  closeDrawer();
}

(async function(){
  if(!sb){setMsg('Renseignez vos identifiants Supabase en haut de admin-orders.html.','err');return;}
  var s=(await sb.auth.getSession()).data.session;
  if(s)enter();
})();
