<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Clients · CÂLINE · Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="caline-config.js"></script>
<style>
:root{
  --cream:#fbf8f2; --beige:#f2eae0; --paper:#fffdf9; --ink:#3c342a; --taupe:#8b7f6d;
  --gold:#c2a35e; --gold-deep:#a8863f; --gold-soft:#dcc9a0; --line:#e7dcc9;
  --serif:'Cormorant Garamond',serif; --sans:'Jost',sans-serif;
  --green:#2c7a4d; --red:#b0573f;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit}
.serif{font-family:var(--serif)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#f6efe3,#efe5d4)}
.login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:clamp(30px,6vw,46px);width:100%;max-width:400px;box-shadow:0 30px 70px rgba(60,52,42,.10);text-align:center}
.brand{font-family:var(--serif);font-size:34px;letter-spacing:.14em;color:var(--gold-deep);margin-bottom:4px}
.brand .paw{display:block;font-size:18px;margin-bottom:2px}
.login-sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--taupe);margin-bottom:30px}
.field{text-align:left;margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin-bottom:7px}
.field input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--cream);
  font-family:var(--sans);font-size:15px;color:var(--ink);transition:.2s}
.field input:focus{outline:none;border-color:var(--gold);background:#fff}
.btn-gold{width:100%;padding:14px;border:none;border-radius:11px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;font-family:var(--sans);
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;transition:.3s;margin-top:6px}
.btn-gold:hover{filter:brightness(1.05);box-shadow:0 10px 26px rgba(168,134,63,.28)}
.btn-gold:disabled{opacity:.6;cursor:default}
.msg{font-size:13px;margin-top:16px;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}

/* ---------- DASHBOARD ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:16px clamp(16px,4vw,40px);background:rgba(251,248,242,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topbar .brand{font-size:24px;margin:0}
.topbar .right{display:flex;align-items:center;gap:14px}
.who{font-size:12px;color:var(--taupe);letter-spacing:.04em}
.logout{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);
  border:1px solid var(--gold-soft);background:none;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.25s;font-family:var(--sans)}
.logout:hover{background:var(--gold-deep);color:#fff;border-color:var(--gold-deep)}
.navlink{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);text-decoration:none;padding:8px 12px;border-radius:8px;transition:.2s}
.navlink:hover{background:var(--beige)}
.shell{max-width:1180px;margin:0 auto;padding:clamp(20px,4vw,38px) clamp(16px,4vw,40px) 70px}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
.h-title{font-family:var(--serif);font-size:clamp(26px,4vw,34px);font-weight:600;margin-bottom:26px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(var(--gold),var(--gold-deep))}
.kpi .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin-bottom:12px}
.kpi .val{font-family:var(--serif);font-size:clamp(26px,3.4vw,36px);font-weight:600;color:var(--ink);line-height:1}
.kpi .val small{font-size:18px;color:var(--gold-deep)}

/* panels */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:30px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px}
.panel h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.panel .ph-sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-bottom:18px}
.chart-box{position:relative;height:240px}

.list{list-style:none}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.rank{font-family:var(--serif);font-size:18px;color:var(--gold-deep);width:26px;flex:none}
.li-main{flex:1;min-width:0}
.li-name{font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-meta{font-size:12px;color:var(--taupe);margin-top:2px}
.li-val{font-family:var(--serif);font-size:17px;color:var(--ink);flex:none}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);padding:0 14px 12px;white-space:nowrap}
td{padding:13px 14px;border-top:1px solid var(--line);white-space:nowrap;color:var(--ink)}
td.num{font-family:var(--serif);font-size:15px}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;letter-spacing:.04em}
.b-pending{background:#f3ead4;color:#9a7b2e}
.b-paid,.b-processing{background:#e3f0e6;color:#2c7a4d}
.b-shipped,.b-delivered{background:#e2ecf4;color:#3667a0}
.b-cancelled,.b-refunded{background:#f4e3de;color:#b0573f}
.empty{text-align:center;color:var(--taupe);padding:34px 0;font-size:14px}
.empty .serif{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}

@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:480px){.kpis{grid-template-columns:1fr 1fr;gap:12px}.kpi{padding:18px 16px}}

.rev-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:-14px 0 30px}
.rev-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px}
.rev-card .rc-lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-bottom:9px}
.rev-card .rc-val{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);line-height:1}
@media(max-width:900px){.rev-row{grid-template-columns:1fr 1fr;gap:12px}}

/* Executive Dashboard v1.1 */
.rev-row{grid-template-columns:repeat(4,1fr)}
@media(min-width:901px){.kpis{grid-template-columns:repeat(6,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}}
.rc-delta{font-family:var(--sans);font-size:11px;font-weight:600;margin-top:6px;letter-spacing:.02em;min-height:14px}
.rc-delta.up{color:#3f9d5a}.rc-delta.down{color:#c0563f}
.li-date{font-weight:400;color:var(--taupe);font-size:12px}

/* Customers */
.ctoolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cinput,.csel{font-family:var(--sans);font-size:13.5px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.cinput{flex:1;min-width:200px}
.csel{cursor:pointer}
.cbtn{font-family:var(--sans);font-size:13px;font-weight:600;padding:10px 16px;border:1px solid var(--ink);border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;transition:.15s}
.cbtn:hover{opacity:.88}
.c-tbl tbody tr{cursor:pointer;transition:.12s}
.c-tbl tbody tr:hover{background:#fbf7ef}
.c-name{font-weight:600}
.opager{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.opager button{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.opager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.opager button:disabled{opacity:.4;cursor:default}
.opager .oinfo{color:var(--taupe);font-size:12.5px;margin:0 8px}
.coverlay{position:fixed;inset:0;background:rgba(28,23,16,.34);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.coverlay.open{opacity:1;pointer-events:auto}
.cdrawer{position:fixed;top:0;right:0;height:100%;width:460px;max-width:92vw;background:var(--bg,#fbf8f2);box-shadow:-14px 0 40px rgba(28,23,16,.16);transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.1,1);z-index:81;overflow-y:auto;padding:26px}
.cdrawer.open{transform:translateX(0)}
.cd-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer;font-size:16px;color:var(--ink);line-height:1}
.cd-h{font-family:var(--serif);font-size:24px;color:var(--ink);margin:4px 0 2px}
.cd-sub{color:var(--taupe);font-size:13px;margin-bottom:20px}
.cd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.cd-box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.cd-box .l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);margin-bottom:6px}
.cd-box .v{font-family:var(--serif);font-size:19px;color:var(--ink)}
.cd-sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin:18px 0 10px;font-weight:600}
.cd-ord{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2,#f0ece3)}
.cd-ord:last-child{border-bottom:0}
.cd-ord .on{font-weight:600;color:var(--ink);font-size:13px}
.cd-ord .om{color:var(--taupe);font-size:12px}
@media(max-width:640px){.ctoolbar .cinput{min-width:100%}.cd-grid{grid-template-columns:1fr 1fr}}

.chart-box canvas{max-width:100%!important}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="paw">🐾</span>CÂLINE</div>
    <div class="login-sub">Espace administration</div>
    <div class="field">
      <label>Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="vous@email.com">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button id="loginBtn" class="btn-gold">Se connecter</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="dash" class="hidden">
  <div class="topbar">
    <div class="brand serif">CÂLINE</div>
    <div class="right">
      <a href="admin-products.html" class="navlink">Produits</a>
      <a href="admin-orders.html" class="navlink">Commandes</a>
      <a href="admin-analytics.html" class="navlink">Analytics</a>
      <a href="admin-customers.html" class="navlink">Clients</a>
      <span class="who" id="who"></span>
      <button class="logout" id="logout">Déconnexion</button>
    </div>
  </div>

  <div class="shell">
    <div class="eyebrow">Clients</div>
    <h1 class="h-title">Base clients</h1>

    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="lab">Total clients</div><div class="val" id="cTotal">\u2014</div></div>
      <div class="kpi"><div class="lab">Revenu total</div><div class="val" id="cRev">\u2014</div></div>
      <div class="kpi"><div class="lab">D\u00e9pense moyenne</div><div class="val" id="cAvg">\u2014</div></div>
    </div>

    <div class="ctoolbar">
      <input type="text" id="cSearch" class="cinput" placeholder="Rechercher un client (nom, e-mail)\u2026">
      <select id="cCountry" class="csel"><option value="all">Tous les pays</option></select>
      <select id="cSort" class="csel">
        <option value="spent_desc">Total d\u00e9pens\u00e9 (\u2193)</option>
        <option value="orders_desc">Commandes (\u2193)</option>
        <option value="last_desc">Derni\u00e8re commande (\u2193)</option>
        <option value="name_asc">Nom (A\u2192Z)</option>
      </select>
      <button class="cbtn" id="cExport">Exporter CSV</button>
    </div>

    <div id="cLoading" class="a-load">Chargement des clients\u2026</div>
    <div id="cErr" class="a-err hidden"></div>

    <div id="cWrap" class="hidden">
      <div class="panel" style="padding:0;overflow:hidden">
        <div class="a-tw">
          <table class="a-tbl c-tbl">
            <thead><tr>
              <th>Client</th><th>E-mail</th><th>Pays</th>
              <th class="num">Commandes</th><th class="num">Total d\u00e9pens\u00e9</th><th class="num">Panier moyen</th>
              <th>Derni\u00e8re</th><th>Premi\u00e8re</th>
            </tr></thead>
            <tbody id="cBody"></tbody>
          </table>
        </div>
      </div>
      <div class="opager" id="cPager"></div>
    </div>
  </div>
</div>

<div class="cdrawer" id="cDrawer"></div>
<div class="coverlay" id="cOverlay"></div>
<script>
var cfg=window.CALINE_SUPABASE||{};
var sb=(cfg.url&&cfg.anonKey&&window.supabase)?window.supabase.createClient(cfg.url,cfg.anonKey):null;
var $=function(id){return document.getElementById(id);};
var eur=function(n){return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';};
var num=function(n){return (Number(n)||0).toLocaleString('fr-FR');};
var dCharts={};

function setMsg(t,cls){var m=$('loginMsg');m.textContent=t||'';m.className='msg '+(cls||'');}

function showLogin(){ $('login').classList.remove('hidden'); $('dash').classList.add('hidden'); }
function showDash(){ $('login').classList.add('hidden'); $('dash').classList.remove('hidden'); }

async function doLogin(){
  if(!sb){setMsg('Configuration Supabase manquante dans admin.html.','err');return;}
  var email=$('email').value.trim(), pass=$('password').value;
  if(!email||!pass){setMsg('Renseignez e-mail et mot de passe.','err');return;}
  $('loginBtn').disabled=true; setMsg('Connexion…','');
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  $('loginBtn').disabled=false;
  if(r.error){setMsg('Identifiants incorrects.','err');return;}
  enter();
}

async function enter(){
  var ov=await sb.rpc('admin_overview');
  if(ov.error){ setMsg('Acc\u00e8s non autoris\u00e9 pour ce compte.','err'); await sb.auth.signOut(); showLogin(); return; }
  var u=(await sb.auth.getUser()).data.user;
  $('who').textContent=u?u.email:'';
  showDash();
  loadCustomers();
}

function paintOverview(){}

async function loadRest(){}

function _setTxt(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
async function loadDashExtra(){}
function _add(x,y){return x+y;}
function _delta(id,cur,prev){
  var e=document.getElementById(id); if(!e)return;
  if(!prev||prev<=0){ e.textContent=''; e.className='rc-delta'; return; }
  var pct=((cur-prev)/prev)*100, up=pct>=0;
  e.textContent=(up?'\u25b2 +':'\u25bc ')+Math.abs(pct).toFixed(0)+'%';
  e.className='rc-delta '+(up?'up':'down');
}
function statusFr(s){return {pending:'En attente',paid:'Payée',processing:'En cours',shipped:'Expédiée',delivered:'Livrée',cancelled:'Annulée',refunded:'Remboursée'}[s]||s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function drawLine(id,labels,data){
  if(dCharts[id])dCharts[id].destroy();
  var ctx=$(id).getContext('2d');
  var g=ctx.createLinearGradient(0,0,0,240); g.addColorStop(0,'rgba(194,163,94,.28)'); g.addColorStop(1,'rgba(194,163,94,0)');
  dCharts[id]=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:data,borderColor:'#a8863f',backgroundColor:g,
    fill:true,tension:.38,borderWidth:2,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:'#a8863f'}]},
    options:chartOpts()});
}
function drawBar(id,labels,data){
  if(dCharts[id])dCharts[id].destroy();
  var ctx=$(id).getContext('2d');
  dCharts[id]=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{data:data,backgroundColor:'#d7bd83',
    hoverBackgroundColor:'#a8863f',borderRadius:6,maxBarThickness:30}]},options:chartOpts()});
}
function chartOpts(){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:'#3c342a',padding:10,displayColors:false,
      callbacks:{label:function(c){return (c.raw||0).toLocaleString('fr-FR',{minimumFractionDigits:2})+' €';}}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:10}}},
            y:{beginAtZero:true,grid:{color:'#efe7d6'},ticks:{font:{size:10},
               callback:function(v){return v>=1000?(v/1000)+'k':v;}}}}};
}

/* events */
$('loginBtn').addEventListener('click',doLogin);
$('password').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
$('logout').addEventListener('click',async function(){ if(sb)await sb.auth.signOut(); location.reload(); });

/* session déjà ouverte ? */
(async function(){
  if(!sb){setMsg('Renseignez vos identifiants Supabase en haut de admin.html.','err');return;}
  var s=(await sb.auth.getSession()).data.session;
  if(s){ enter(); }
})();

/* ================= CUSTOMERS (données réelles) ================= */
var CUST=[], cCur=1, C_PER=25, cCurrent=null;
function _cEsc(x){return esc(x);}
function _cDate(d){ if(!d)return '\u2014'; try{return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});}catch(e){return '\u2014';} }
function _paidLike(st){return st==='paid'||st==='processing'||st==='shipped'||st==='delivered';}

async function loadCustomers(){
  var LO=document.getElementById('cLoading'), WR=document.getElementById('cWrap'), ER=document.getElementById('cErr');
  LO.classList.remove('hidden'); WR.classList.add('hidden'); ER.classList.add('hidden');
  try{
    var res=await Promise.all([
      sb.from('customers').select('id,full_name,email,country,phone,city,created_at').limit(5000),
      sb.from('orders').select('customer_id,email,total,status,created_at,order_number,shipping_country').limit(8000)
    ]);
    var custs=(res[0]&&!res[0].error&&res[0].data)?res[0].data:[];
    var ords=(res[1]&&!res[1].error&&res[1].data)?res[1].data:[];

    // index commandes par customer_id + par email (fallback)
    var byId={}, byEmail={};
    ords.forEach(function(o){
      if(o.customer_id!=null){ (byId[o.customer_id]=byId[o.customer_id]||[]).push(o); }
      else if(o.email){ (byEmail[(o.email+'').toLowerCase()]=byEmail[(o.email+'').toLowerCase()]||[]).push(o); }
    });

    CUST=custs.map(function(c){
      var list=(byId[c.id]||[]).concat(byEmail[(c.email+'').toLowerCase()]||[]);
      var paid=list.filter(function(o){return _paidLike(o.status);});
      var spent=paid.reduce(function(a,o){return a+(Number(o.total)||0);},0);
      var dates=list.map(function(o){return o.created_at;}).filter(Boolean).sort();
      return {
        id:c.id, name:c.full_name||'\u2014', email:c.email||'', country:(c.country||'').trim()||'\u2014',
        phone:c.phone||'', city:c.city||'', reg:c.created_at,
        nOrders:list.length, nPaid:paid.length, spent:spent,
        aov: paid.length?spent/paid.length:0,
        first: dates.length?dates[0]:null, last: dates.length?dates[dates.length-1]:null,
        orders:list.sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'');})
      };
    });

    // stats
    var totalRev=CUST.reduce(function(a,c){return a+c.spent;},0);
    _setTxt('cTotal',String(CUST.length));
    _setTxt('cRev',eur(totalRev));
    _setTxt('cAvg',CUST.length?eur(totalRev/CUST.length):eur(0));

    // pays
    var sel=document.getElementById('cCountry'); var seen={};
    CUST.forEach(function(c){ if(c.country&&c.country!=='\u2014')seen[c.country]=1; });
    Object.keys(seen).sort().forEach(function(k){ var o=document.createElement('option'); o.value=k;o.textContent=k; sel.appendChild(o); });

    cCur=1; renderCust();
    LO.classList.add('hidden'); WR.classList.remove('hidden');
  }catch(err){
    LO.classList.add('hidden');
    ER.innerHTML='Impossible de charger les clients. <button class="cbtn" style="padding:4px 12px;margin-left:8px" onclick="loadCustomers()">R\u00e9essayer</button>';
    ER.classList.remove('hidden');
  }
}
function _cFiltered(){
  var q=(document.getElementById('cSearch').value||'').toLowerCase().trim();
  var ct=document.getElementById('cCountry').value;
  var sort=document.getElementById('cSort').value;
  var arr=CUST.filter(function(c){
    if(ct!=='all' && c.country!==ct) return false;
    if(q && (c.name+' '+c.email).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  arr.sort(function(a,b){
    if(sort==='spent_desc')return b.spent-a.spent;
    if(sort==='orders_desc')return b.nOrders-a.nOrders;
    if(sort==='last_desc')return (b.last||'').localeCompare(a.last||'');
    if(sort==='name_asc')return (a.name||'').localeCompare(b.name||'');
    return 0;
  });
  return arr;
}
function renderCust(){
  var arr=_cFiltered();
  var tb=document.getElementById('cBody');
  if(!arr.length){ tb.innerHTML='<tr><td colspan="8" style="padding:26px;text-align:center;color:var(--taupe)">Aucun client pour ce filtre.<br><span style="font-size:12px">Essayez d\u2019\u00e9largir la recherche ou de changer de pays.</span></td></tr>'; document.getElementById('cPager').innerHTML=''; return; }
  var pages=Math.ceil(arr.length/C_PER); if(cCur>pages)cCur=pages; if(cCur<1)cCur=1;
  var slice=arr.slice((cCur-1)*C_PER, cCur*C_PER);
  tb.innerHTML=slice.map(function(c){
    return '<tr onclick="openCust('+c.id+')">'+
      '<td class="c-name">'+_cEsc(c.name)+'</td>'+
      '<td>'+_cEsc(c.email)+'</td>'+
      '<td>'+_cEsc(c.country)+'</td>'+
      '<td class="num">'+c.nOrders+'</td>'+
      '<td class="num">'+eur(c.spent)+'</td>'+
      '<td class="num">'+eur(c.aov)+'</td>'+
      '<td>'+_cDate(c.last)+'</td>'+
      '<td>'+_cDate(c.first)+'</td></tr>';
  }).join('');
  // pager
  var pg=document.getElementById('cPager'); var h='';
  h+='<button onclick="cGo('+(cCur-1)+')"'+(cCur<=1?' disabled':'')+'>\u2039</button>';
  h+='<span class="oinfo">'+((cCur-1)*C_PER+1)+'\u2013'+Math.min(cCur*C_PER,arr.length)+' sur '+arr.length+'</span>';
  h+='<button onclick="cGo('+(cCur+1)+')"'+(cCur>=pages?' disabled':'')+'>\u203a</button>';
  pg.innerHTML=h;
}
function cGo(p){ cCur=p; renderCust(); }
function openCust(id){
  var c=CUST.filter(function(x){return x.id===id;})[0]; if(!c)return; cCurrent=c;
  var ordsHtml = c.orders.length? c.orders.map(function(o){
    return '<div class="cd-ord"><div><div class="on">'+_cEsc(o.order_number||('#'+(o.id||'')))+'</div><div class="om">'+_cDate(o.created_at)+' \u00b7 '+statusFr(o.status)+'</div></div><div class="on">'+eur(o.total)+'</div></div>';
  }).join('') : '<div style="color:var(--taupe);font-size:13px;padding:8px 0">Aucune commande.</div>';
  var d=document.getElementById('cDrawer');
  d.innerHTML='<button class="cd-close" onclick="closeCust()">\u2715</button>'+
    '<div class="cd-h">'+_cEsc(c.name)+'</div>'+
    '<div class="cd-sub">'+_cEsc(c.email)+(c.phone?' \u00b7 '+_cEsc(c.phone):'')+'</div>'+
    '<div class="cd-grid">'+
      '<div class="cd-box"><div class="l">Commandes</div><div class="v">'+c.nOrders+'</div></div>'+
      '<div class="cd-box"><div class="l">Total d\u00e9pens\u00e9</div><div class="v">'+eur(c.spent)+'</div></div>'+
      '<div class="cd-box"><div class="l">Panier moyen</div><div class="v">'+eur(c.aov)+'</div></div>'+
      '<div class="cd-box"><div class="l">Pays</div><div class="v" style="font-size:15px">'+_cEsc(c.country)+'</div></div>'+
      '<div class="cd-box"><div class="l">Premi\u00e8re commande</div><div class="v" style="font-size:15px">'+_cDate(c.first)+'</div></div>'+
      '<div class="cd-box"><div class="l">Derni\u00e8re commande</div><div class="v" style="font-size:15px">'+_cDate(c.last)+'</div></div>'+
    '</div>'+
    '<div class="cd-sec">Historique des commandes</div>'+ordsHtml;
  d.classList.add('open'); document.getElementById('cOverlay').classList.add('open');
}
function closeCust(){ document.getElementById('cDrawer').classList.remove('open'); document.getElementById('cOverlay').classList.remove('open'); }
function cExport(){
  var arr=_cFiltered();
  var rows=[['Client','E-mail','Pays','Commandes','Total depense','Panier moyen','Premiere','Derniere']];
  arr.forEach(function(c){ rows.push([c.name,c.email,c.country,c.nOrders,c.spent.toFixed(2),c.aov.toFixed(2),_cDate(c.first),_cDate(c.last)]); });
  var csv='\ufeff'+rows.map(function(r){return r.map(function(x){var s=(''+x).replace(/"/g,'""');return /[",;\n]/.test(s)?'"'+s+'"':s;}).join(';');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='caline-clients.csv'; a.click(); setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
document.addEventListener('input',function(e){ if(e.target&&e.target.id==='cSearch'){cCur=1;renderCust();} });
document.addEventListener('change',function(e){ if(e.target&&(e.target.id==='cCountry'||e.target.id==='cSort')){cCur=1;renderCust();} });
document.addEventListener('click',function(e){ if(e.target&&e.target.id==='cExport')cExport(); if(e.target&&e.target.id==='cOverlay')closeCust(); });

</script>
</body>
</html>
